name: Example custom Non-GKI kernel workflow

# GitHub only runs workflow files directly under .github/workflows.
# This file is a copyable reference template and is intentionally inactive.
on:
  workflow_dispatch:
    inputs:
      spoof_kernel_version: { description: Spoof kernel version after SukiSU/SUSFS integration, required: true, default: false, type: boolean }
      spoofed_kernel_version: { description: Version in major.minor.sublevel format, required: false, type: string }
      codename: { description: Device codename, required: true, type: string }
      kernel_repo: { description: Complete .git kernel repository URL, required: true, type: string }
      defconfig: { description: Path ending _defconfig, required: false, type: string }
      device_config: { description: Optional path ending .config, required: false, type: string }
      enable_pstore_debug: { description: Persistent crash/console logs for 4.x/GKI; device ramoops reserved memory required, required: true, default: false, type: boolean }
      build_target: { description: Primary build target (Image.gz or Image.gz-dtb), required: false, default: Image.gz-dtb, type: choice, options: [Image.gz, Image.gz-dtb] }
      author: { description: Author, required: true, default: XiZi, type: string }
      ab_partition: { description: A/B device (reporting only; AK3 detects the active slot at install time), required: true, type: boolean }
      disable_lto: { description: Disable LTO, required: true, type: boolean }
      ignore_werror: { description: Downgrade all compiler -Werror diagnostics to warnings, required: true, default: false, type: boolean }
      force_selinux_enforcing: { description: Force SELinux enforcing; incompatible policy may prevent booting, required: true, default: false, type: boolean }
      integrate_susfs: { description: SUSFS and SukiSU, required: true, type: boolean }
      kernel_name: { description: Kernel name, required: false, default: by_XiZi, type: string }
      build_time: { description: ISO-8601 timestamp, required: false, type: string }
      kernel_version: { description: Kernel version suffix, required: false, default: v1.0, type: string }
      integrate_droidspaces: { description: DroidSpaces, required: true, type: boolean }
      package_ak3: { description: AnyKernel3, required: true, type: boolean }
      ak3_kernel_target: { description: AnyKernel3 target (Image.gz or Image.gz-dtb), required: true, default: Image.gz-dtb, type: choice, options: [Image.gz, Image.gz-dtb] }
      apply_device_patches: { description: Apply pre-patches and defer SUSFS repair patches automatically, required: true, type: boolean }
      device_patch_repo: { description: Complete .git device patch repository URL, required: false, type: string }
      device_patch_branch: { description: Device patch branch, required: false, default: main, type: string }
      device_patch_names: { description: Space-separated patch filenames under Patches/, required: false, type: string }

# Copy the job steps from ../build-custom-kernel-Eng.yml and adjust toolchain/target
# for the selected clean kernel tree before enabling this as a real workflow.
# Keep ARCH=arm64 and forward inputs.enable_pstore_debug to ENABLE_PSTORE_DEBUG.
# Copy the always-run pstore artifact step too; it preserves diagnostics on failure.
